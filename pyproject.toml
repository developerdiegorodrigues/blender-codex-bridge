[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-codex-bridge"
version = "0.1.0"
description = "Local, auditable bridge between Codex and Blender"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blender-agent = "blender_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
